version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: web-lab-3-postgres
    restart: always
    environment:
      POSTGRES_DB: weblab3db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  backend:
    build:
      context: .
      dockerfile: config/backend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
  frontend:
    container_name: web-lab-3-frontend
    build:
      context: .
      dockerfile: config/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:8080"
      - "443:8443"
